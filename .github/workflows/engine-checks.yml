name: Engine checks
on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-checks.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s engine/tests -v
      - name: Validate syntax
        run: python -m compileall -q engine
